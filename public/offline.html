<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Prativa Stock</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080C14;
      color: #F8FAFC;
      margin: 0;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }
    .card {
      background: #0F1623;
      border: 1px solid #1B263B;
      padding: 32px 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.12);
      color: #38BDF8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 19px; font-weight: 700; margin: 0 0 8px; color: #fff; }
    p { font-size: 13.5px; color: #818FA6; line-height: 1.5; margin: 0 0 20px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 11px 16px;
      background: #2563EB;
      color: #fff;
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 8px;
      text-decoration: none;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-1.272-12.728m1.272 12.728L6 21M8.464 15.536a5 5 0 01-1.272-7.072m0 0L3 3" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>This page requires a live connection to access. Reconnect to WiFi or mobile network and try again.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
