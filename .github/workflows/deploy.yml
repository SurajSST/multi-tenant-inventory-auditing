name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: prativa_inventory_test
          MARIADB_USER: prativa_test
          MARIADB_PASSWORD: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prativa_inventory_test
      DB_USERNAME: prativa_test
      DB_PASSWORD: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, fileinfo, zip, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify MariaDB connection
        run: |
          php <<'PHP'
          <?php
          $dsn = sprintf(
              'mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4',
              getenv('DB_HOST'),
              getenv('DB_PORT'),
              getenv('DB_DATABASE'),
          );
          $pdo = new PDO($dsn, getenv('DB_USERNAME'), getenv('DB_PASSWORD'));
          printf("Connected to MariaDB %s\n", $pdo->query('SELECT VERSION()')->fetchColumn());
          PHP

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - name: Install frontend dependencies and build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Run MariaDB test suite
        run: php artisan test

      - name: Verify database integrity controls
        run: php artisan integrity:verify

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, fileinfo, zip, gd
          coverage: none

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: 📦 Install NPM dependencies & Build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/.phpunit*
            **/.env*
            storage/*.key
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/pail/**
            package.json
            package-lock.json
            vite.config.js
            **/.editorconfig
            **/.idea/**
            **/.vscode/**
            **/.DS_Store
            **/Thumbs.db
            README.md
            CLAUDE.md
            AGENTS.md
